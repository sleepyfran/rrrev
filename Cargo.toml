[package]
name = "rrrev"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
git2 = "0.21.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
terminal-colorsaurus = "1.0.3"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-onig"] }

[dev-dependencies]
tempfile = "3.27.0"
