[package]
name = "rrrev"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
dark-light = { version = "3.0.0", default-features = false }
git2 = "0.21.0"
libloading = "0.8.9"
tree-sitter-language = "0.1.9"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal-colorsaurus = "1.0.3"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.27.2"
pulldown-cmark = { version = "0.13.6", default-features = false }
notify = "8.2.2"

[dev-dependencies]
tempfile = "3.27.0"
# Grammars for tests only: rrrev builds the ones you enable (`rrrev lang
# enable`) and loads them at run time.
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.24.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-fsharp = "0.3.13"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"
