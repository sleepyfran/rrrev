[package]
name = "rrrev"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
dark-light = { version = "3.0.0", default-features = false }
git2 = "0.21.0"
libloading = "0.8.9"
tree-sitter-language = "0.1.9"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal-colorsaurus = "1.0.3"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.27.2"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = { version = "0.24.0", optional = true }
tree-sitter-cpp = "0.23.4"
tree-sitter-fsharp = { version = "0.3.13", optional = true }
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = { version = "1.1.0", optional = true }
tree-sitter-lua = "0.5.0"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = { version = "0.7.4", optional = true }
tree-sitter-typescript = "0.23.2"

[features]
# Grammars for scopes (breadcrumbs, `ze`). The heavy ones are opt-in: each
# adds 3-14 MB to the binary. Files without a grammar go by indentation.
default = []
csharp = ["dep:tree-sitter-c-sharp"]
fsharp = ["dep:tree-sitter-fsharp"]
kotlin = ["dep:tree-sitter-kotlin-ng"]
swift = ["dep:tree-sitter-swift"]
all-languages = ["csharp", "fsharp", "kotlin", "swift"]

[dev-dependencies]
tempfile = "3.27.0"
